name: 提交糾錯
description: 看到哪一條講得不準？三分鐘就能提
title: "[糾錯] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        ### 感謝你

        這是本項目最需要的動作。寫文章要一小時，糾錯只要三分鐘 ——
        但糾錯最能看出一個人專不專業、正不正念。

  - type: input
    id: where
    attributes:
      label: 你指的是哪一條
      description: 章號 / 條號 / 卡片標題
      placeholder: 例如：第41章 第90條 / 「轉介與回佣」場景卡
    validations:
      required: true

  - type: textarea
    id: quote
    attributes:
      label: 你認為哪裡不準
      description: 請引用原句
    validations:
      required: true

  - type: textarea
    id: basis
    attributes:
      label: 依據是什麼
      description: |
        官方原文連結、監管機構指引，或你自己的執業判斷。
        若是判斷而非引述，請標明 —— 兩者都歡迎，但要分清楚。
    validations:
      required: true

  - type: textarea
    id: suggest
    attributes:
      label: 你建議怎麼改（可選）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我沒有在這一則裡推薦具體產品、留下公司名稱或個人姓名
          required: true
        - label: 我沒有披露任何客戶資料或個資
          required: true
