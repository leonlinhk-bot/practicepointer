name: 貢獻內容
description: 新增場景卡、概念卡或條文索引
title: "[貢獻] "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        提交前請先讀 [`CONTRIBUTING.md`](../../CONTRIBUTING.md)，
        特別是「合規內容的硬規則」那一節。

  - type: dropdown
    id: kind
    attributes:
      label: 類型
      options:
        - 執業場景卡
        - 概念卡 / 十秒講法
        - 條文索引條目
        - 用字或用語修正
        - 其他
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 內容
      description: |
        若是合規相關，請用三段式：常見疑問 → 條例出處 → 自查三問。
        不要下「這樣做就合規」的結論。
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 出處連結
      description: 官方原文或監管機構指引（條文索引類必填）
      placeholder: https://www.elegislation.gov.hk/...
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我沒有推薦具體保險產品或做產品比較
          required: true
        - label: 我沒有寫入公司名稱、商標、Logo 或個人姓名
          required: true
        - label: 若涉及合規，我沒有下「這樣做就合規」的結論
          required: true
        - label: 內容經我本人核對，不是 AI 直接生成未經檢查的
          required: true
